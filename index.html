async function shrink(f){
  if(!/^image\/(png|jpe?g|webp)$/.test(f.type)||f.size<250e3)return f;
  try{const b=await createImageBitmap(f),k=Math.min(1,1600/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);
    const o=await new Promise(r=>c.toBlob(r,'image/webp',.86));
    return o&&o.type==='image/webp'&&o.size<f.size?new File([o],f.name.replace(/\.\w+$/,'')+'.webp',{type:'image/webp'}):f}catch(e){return f}}
